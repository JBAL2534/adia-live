<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ADIA · Démonstrations en direct</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --noir: #000000; --filet: #3A2F15; --or: #D4A93C; --or-clair: #F0D27C; --texte: #ECE5D3; --doux: #A39A84;
    --titre: "Cinzel", "Trajan Pro", Georgia, serif; --corps: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--noir); color: var(--texte); font: 400 1.0625rem/1.55 var(--corps); -webkit-font-smoothing: antialiased; }
  main { max-width: 26rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; text-align: center; }
  img { width: min(15rem, 62vw); height: auto; display: block; margin: 0 auto; }
  h1 { font: 600 clamp(1.5rem, 6vw, 2rem)/1.2 var(--titre); color: var(--or); margin: 0.75rem 0 0.35rem; letter-spacing: 0.02em; text-wrap: balance; }
  p { color: var(--doux); margin: 0 0 1.5rem; }
  nav { display: grid; gap: 0.8rem; }
  nav a { display: block; padding: 0.95rem 1.15rem; border-radius: 1rem; border: 1px solid var(--or); color: var(--or-clair);
    text-decoration: none; font: 600 1.05rem/1.25 var(--titre); letter-spacing: 0.14em; }
  nav a small { display: block; margin-top: 0.3rem; font: 400 0.9rem/1.3 var(--corps); letter-spacing: 0; color: var(--doux); }
  nav a:focus-visible { outline: 2px solid var(--or-clair); outline-offset: 3px; }
  nav a:active { background: #100E09; }
</style>
</head>
<body>
<main>
  <img src="logo.jpg" alt="ADIA, Académie Dentaire d’Intelligence Artificielle" width="320" height="289">
  <h1>Démonstrations en direct</h1>
  <p>Choisissez votre conférence</p>
  <nav>
    <a href="sapo-implant/">SAPO IMPLANT<small>Vendredi 20 novembre 2026</small></a>
    <a href="adf/">ADF 2026<small>24 au 28 novembre 2026</small></a>
    <a href="sapo-greffes/">SAPO GREFFES<small>Mercredi 2 décembre 2026</small></a>
  </nav>
</main>
</body>
</html>
